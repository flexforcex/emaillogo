name: FlexForceX
options:
  bundleIdPrefix: com.flexforcex
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  FlexForceX:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: FlexForceX
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flexforcex.app
        INFOPLIST_FILE: FlexForceX/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: <REPLACE_ME>
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets: []
