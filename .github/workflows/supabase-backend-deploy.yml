name: Deploy Supabase Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/bootstrap-supabase.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TERRA_API_KEY: ${{ secrets.TERRA_API_KEY }}
      TERRA_DEV_ID: ${{ secrets.TERRA_DEV_ID }}
      TERRA_WEBHOOK_SECRET: ${{ secrets.TERRA_WEBHOOK_SECRET }}
      TERRA_ENV: ${{ secrets.TERRA_ENV }}
      TERRA_REDIRECT_URL: ${{ secrets.TERRA_REDIRECT_URL }}
      ADMIN_ALLOWLIST_EMAILS: ${{ secrets.ADMIN_ALLOWLIST_EMAILS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push

      - name: Set function secrets
        run: |
          supabase secrets set \
            TERRA_API_KEY="$TERRA_API_KEY" \
            TERRA_DEV_ID="$TERRA_DEV_ID" \
            TERRA_WEBHOOK_SECRET="$TERRA_WEBHOOK_SECRET" \
            TERRA_ENV="$TERRA_ENV" \
            TERRA_REDIRECT_URL="$TERRA_REDIRECT_URL" \
            ADMIN_ALLOWLIST_EMAILS="$ADMIN_ALLOWLIST_EMAILS"

      - name: Deploy edge functions
        run: |
          supabase functions deploy terra-webhook
          supabase functions deploy terra-connect
          supabase functions deploy terra-status
          supabase functions deploy admin-metrics
